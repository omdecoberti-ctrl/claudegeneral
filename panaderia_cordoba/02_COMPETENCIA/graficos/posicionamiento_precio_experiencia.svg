<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Montserrat,Segoe UI,Arial,sans-serif" role="img" aria-label="Mapa de posicionamiento: precio × experiencia"><text x="0" y="18" font-size="15" font-weight="800" fill="#404040">Mapa de posicionamiento: precio × experiencia</text><line x1="95" y1="498" x2="95" y2="40" stroke="#E6E6E6"/><line x1="62" y1="475" x2="730" y2="475" stroke="#E6E6E6"/><text x="95" y="514" text-anchor="middle" font-size="10.5" fill="#7a7a7a">1</text><text x="54" y="479" text-anchor="end" font-size="10.5" fill="#7a7a7a">1</text><line x1="162" y1="498" x2="162" y2="40" stroke="#E6E6E6"/><line x1="62" y1="429" x2="730" y2="429" stroke="#E6E6E6"/><text x="162" y="514" text-anchor="middle" font-size="10.5" fill="#7a7a7a">2</text><text x="54" y="433" text-anchor="end" font-size="10.5" fill="#7a7a7a">2</text><line x1="229" y1="498" x2="229" y2="40" stroke="#E6E6E6"/><line x1="62" y1="384" x2="730" y2="384" stroke="#E6E6E6"/><text x="229" y="514" text-anchor="middle" font-size="10.5" fill="#7a7a7a">3</text><text x="54" y="388" text-anchor="end" font-size="10.5" fill="#7a7a7a">3</text><line x1="296" y1="498" x2="296" y2="40" stroke="#E6E6E6"/><line x1="62" y1="338" x2="730" y2="338" stroke="#E6E6E6"/><text x="296" y="514" text-anchor="middle" font-size="10.5" fill="#7a7a7a">4</text><text x="54" y="342" text-anchor="end" font-size="10.5" fill="#7a7a7a">4</text><line x1="363" y1="498" x2="363" y2="40" stroke="#E6E6E6"/><line x1="62" y1="292" x2="730" y2="292" stroke="#E6E6E6"/><text x="363" y="514" text-anchor="middle" font-size="10.5" fill="#7a7a7a">5</text><text x="54" y="296" text-anchor="end" font-size="10.5" fill="#7a7a7a">5</text><line x1="429" y1="498" x2="429" y2="40" stroke="#E6E6E6"/><line x1="62" y1="246" x2="730" y2="246" stroke="#E6E6E6"/><text x="429" y="514" text-anchor="middle" font-size="10.5" fill="#7a7a7a">6</text><text x="54" y="250" text-anchor="end" font-size="10.5" fill="#7a7a7a">6</text><line x1="496" y1="498" x2="496" y2="40" stroke="#E6E6E6"/><line x1="62" y1="200" x2="730" y2="200" stroke="#E6E6E6"/><text x="496" y="514" text-anchor="middle" font-size="10.5" fill="#7a7a7a">7</text><text x="54" y="204" text-anchor="end" font-size="10.5" fill="#7a7a7a">7</text><line x1="563" y1="498" x2="563" y2="40" stroke="#E6E6E6"/><line x1="62" y1="154" x2="730" y2="154" stroke="#E6E6E6"/><text x="563" y="514" text-anchor="middle" font-size="10.5" fill="#7a7a7a">8</text><text x="54" y="158" text-anchor="end" font-size="10.5" fill="#7a7a7a">8</text><line x1="630" y1="498" x2="630" y2="40" stroke="#E6E6E6"/><line x1="62" y1="109" x2="730" y2="109" stroke="#E6E6E6"/><text x="630" y="514" text-anchor="middle" font-size="10.5" fill="#7a7a7a">9</text><text x="54" y="113" text-anchor="end" font-size="10.5" fill="#7a7a7a">9</text><line x1="697" y1="498" x2="697" y2="40" stroke="#E6E6E6"/><line x1="62" y1="63" x2="730" y2="63" stroke="#E6E6E6"/><text x="697" y="514" text-anchor="middle" font-size="10.5" fill="#7a7a7a">10</text><text x="54" y="67" text-anchor="end" font-size="10.5" fill="#7a7a7a">10</text><text x="396" y="546" text-anchor="middle" font-size="12" fill="#404040">Precio percibido (1 = barato · 10 = caro)</text><text transform="translate(16,269) rotate(-90)" text-anchor="middle" font-size="12" fill="#404040">Experiencia (1–10)</text><rect x="363" y="177" width="100" height="69" fill="#1F6FD0" fill-opacity=".10" stroke="#1F6FD0" stroke-dasharray="5 4"/><text x="367" y="171" font-size="11" font-weight="700" fill="#1F6FD0">Hueco: precio medio + experiencia media-alta</text><g><title>La Celeste (foco: 24 h + tradición (1952) + promos oportunistas); Panadería Del Pilar (foco: tradición +150 años, franquicias, B2B empresas/supermercados); Panadería Independencia (foco: &#x27;la panadería más antigua de Córdoba&#x27; (1863)); Perdú (foco: calidad desde 1997); Bonafide (foco: cafetería de marca tradicional; combo café con leche + alfajor) — precio 5, Experiencia (1–10) 4</title><circle cx="363" cy="338" r="7" fill="#B12028" stroke="#fff" stroke-width="2"/></g><text x="374" y="316" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">La Celeste</text><text x="374" y="329" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Del Pilar</text><text x="374" y="342" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Independencia</text><text x="374" y="355" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Perdú</text><text x="374" y="368" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Bonafide</text><g><title>Lo+Rico (foco: medialunas, capilaridad (26 sucursales), delivery/TikTok); Armando Medialunas (foco: especialista medialunas, expansión (8→13 locales)) — precio 4, Experiencia (1–10) 3</title><circle cx="296" cy="384" r="7" fill="#B12028" stroke="#fff" stroke-width="2"/></g><text x="307" y="381" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Lo+Rico</text><text x="307" y="394" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Armando</text><g><title>Culpa de los Dos (foco: producto de culto artesanal (alfajores, medialunas, mafaldas), escasez/filas); Café Martínez Córdoba (foco: combo desayuno precio cerrado + promos bancarias) — precio 7, Experiencia (1–10) 6</title><circle cx="496" cy="246" r="7" fill="#B12028" stroke="#fff" stroke-width="2"/></g><text x="485" y="244" text-anchor="end" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Culpa de los Dos</text><text x="485" y="257" text-anchor="end" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Café Martínez</text><g><title>Superanfibio (foco: café de especialidad, minimalismo, merienda) — precio 7, Experiencia (1–10) 8</title><circle cx="496" cy="154" r="7" fill="#B12028" stroke="#fff" stroke-width="2"/></g><text x="507" y="158" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Superanfibio</text><g><title>Cherry Season (foco: tueste propio, brunch, reels con cara humana) — precio 8, Experiencia (1–10) 9</title><circle cx="563" cy="109" r="7" fill="#B12028" stroke="#fff" stroke-width="2"/></g><text x="574" y="113" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Cherry Season</text><g><title>Havanna Córdoba (foco: alfajor ícono + combos cafetería + app propia) — precio 8, Experiencia (1–10) 6</title><circle cx="563" cy="246" r="7" fill="#B12028" stroke="#fff" stroke-width="2"/></g><text x="574" y="250" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Havanna</text><g><title>Starbucks (foco: experiencia global + combos 15-50% off) — precio 9, Experiencia (1–10) 7</title><circle cx="630" cy="200" r="7" fill="#B12028" stroke="#fff" stroke-width="2"/></g><text x="641" y="204" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Starbucks</text><g><title>Mostaza (foco: precio (combo desayuno fast food)) — precio 3, Experiencia (1–10) 2</title><circle cx="229" cy="429" r="7" fill="#B12028" stroke="#fff" stroke-width="2"/></g><text x="240" y="433" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">Mostaza</text><g><title>YPF Full (foco: conveniencia 24 h + ServiClub + app YPF) — precio 6, Experiencia (1–10) 3</title><circle cx="429" cy="384" r="7" fill="#B12028" stroke="#fff" stroke-width="2"/></g><text x="440" y="388" text-anchor="start" font-size="11.5" fill="#404040" stroke="#fff" stroke-width="3" paint-order="stroke">YPF Full</text><text x="754" y="530" text-anchor="end" font-size="10" fill="#7a7a7a">Puntajes 1–10 = [INTERPRETACIÓN] del analista a partir de precios, reseñas y comunicación (I015–I016).</text></svg>