<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" font-family="Montserrat,Segoe UI,Arial,sans-serif" role="img" aria-label="Tamaño de mercado estimado — Córdoba Capital (USD millones/año)"><text x="0" y="18" font-size="15" font-weight="800" fill="#404040">Tamaño de mercado estimado — Córdoba Capital (USD millones/año)</text><line x1="230.0" y1="40" x2="230.0" y2="166" stroke="#E6E6E6"/><line x1="345.0" y1="40" x2="345.0" y2="166" stroke="#E6E6E6"/><line x1="460.0" y1="40" x2="460.0" y2="166" stroke="#E6E6E6"/><line x1="575.0" y1="40" x2="575.0" y2="166" stroke="#E6E6E6"/><line x1="690.0" y1="40" x2="690.0" y2="166" stroke="#E6E6E6"/><text x="220" y="59" text-anchor="end" font-size="12.5" fill="#404040">Panificados artesanales (TAM-a)</text><text x="220" y="71" text-anchor="end" font-size="10" fill="#7a7a7a">≈ $352.800 M/año</text><g><title>Panificados artesanales (TAM-a): 227 M</title><rect x="230.0" y="50" width="410.7" height="16" rx="4" fill="#F18A00"/></g><text x="646.7" y="62" font-size="12" font-weight="700" fill="#404040">227 M</text><text x="220" y="89" text-anchor="end" font-size="12.5" fill="#404040">Desayuno/merienda fuera del hogar (TAM-b)</text><text x="220" y="101" text-anchor="end" font-size="10" fill="#7a7a7a">≈ $163.800 M/año</text><g><title>Desayuno/merienda fuera del hogar (TAM-b): 105 M</title><rect x="230.0" y="80" width="190.0" height="16" rx="4" fill="#F18A00"/></g><text x="426.0" y="92" font-size="12" font-weight="700" fill="#404040">105 M</text><text x="220" y="119" text-anchor="end" font-size="12.5" fill="#404040">SAM: zonas ingreso medio-alto × segmento premium</text><text x="220" y="131" text-anchor="end" font-size="10" fill="#7a7a7a">≈ $38.700 M/año</text><g><title>SAM: zonas ingreso medio-alto × segmento premium: 25 M</title><rect x="230.0" y="110" width="45.2" height="16" rx="4" fill="#F18A00"/></g><text x="281.2" y="122" font-size="12" font-weight="700" fill="#404040">25 M</text><text x="220" y="149" text-anchor="end" font-size="12.5" fill="#404040">SOM: 1 local (250 tickets/día)</text><text x="220" y="161" text-anchor="end" font-size="10" fill="#7a7a7a">≈ $585 M/año</text><g><title>SOM: 1 local (250 tickets/día): 0,4 M</title><rect x="230.0" y="140" width="2.0" height="16" rx="4" fill="#F18A00"/></g><text x="236.7" y="152" font-size="12" font-weight="700" fill="#404040">0,4 M</text><text x="0" y="202" font-size="10.5" fill="#7a7a7a">[ESTIMACIÓN] paramétrica sobre supuestos a validar (I005 §4). TC $1.545/USD (sep-2026).</text></svg>